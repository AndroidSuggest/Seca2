name: Build APK

on:
  workflow_dispatch:

env:
  VERSION: v0.0.1

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle and load from cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew :apps:contacts:assembleRelease --no-daemon --parallel --build-cache --configuration-cache

      - name: Rename APK
        run: mv apps/contacts/build/outputs/apk/release/*.apk apps/contacts/build/outputs/apk/release/seca-${VERSION}-own.apk

      - name: Upload release APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          files: apps/contacts/build/outputs/apk/release/seca-${{ env.VERSION }}-own.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
